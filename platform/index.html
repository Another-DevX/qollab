<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Qollab · Quantum Error Correction</title>
<meta name="description" content="An interactive feature on quantum error correction: choose a module and explore quantum errors, build codes, and discover how quantum information can be protected." />
<style>
  :root{
    --surface:#f6f5f1; --surface-2:#ffffff; --surface-3:#efede7;
    --ink:#16233c; --muted:#4b5566; --faint:#8b909b; --line:#e2dfd8;
    --accent:#2f5d8a; --accent-2:#9a4f72; --amber:#a9762f; --good:#2f7d55; --bad:#b0453c;
    --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --shadow:0 1px 2px rgba(22,35,60,.05), 0 12px 30px -22px rgba(22,35,60,.35);
    color-scheme:light;
  }
  html.dark{
    --surface:#12141a; --surface-2:#191c24; --surface-3:#22262f;
    --ink:#e9ecf2; --muted:#a3aab8; --faint:#6f7688; --line:#2b303b;
    --accent:#7fb3e8; --accent-2:#d98fb6; --amber:#d7b06a; --good:#6fbf94; --bad:#e08b84;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 36px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background-color:var(--surface); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    background-image:radial-gradient(90rem 44rem at 50% -20%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%);
    background-attachment:fixed;
  }
  ::selection{background:color-mix(in srgb, var(--accent) 26%, transparent)}
  a{color:inherit}
  .serif{font-family:var(--serif)}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}

  /* ---------- Header ---------- */
  header.site{position:sticky; top:0; z-index:50; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
  .header-inner{max-width:1040px; margin:0 auto; height:64px; padding:0 20px; display:flex; align-items:center; gap:14px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; flex:0 0 auto}
  .brand-mark{position:relative; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center}
  .brand-mark .ring{position:absolute; inset:0; border-radius:50%; border:1px solid color-mix(in srgb, var(--accent) 55%, transparent)}
  .brand-mark .ring2{position:absolute; inset:0; border-radius:50%; border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); transform:rotateX(65deg)}
  .brand-mark .core{width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .brand-text{display:flex; flex-direction:column; line-height:1}
  .brand-text b{font-size:14px; letter-spacing:-.01em}
  .brand-text span{font-size:10px; text-transform:uppercase; letter-spacing:.2em; color:var(--faint); font-family:var(--mono)}
  .header-note{margin-left:12px; font-size:12px; color:var(--faint)}
  @media (max-width:520px){ .header-note{display:none} }
  .theme-btn{margin-left:auto; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:9px; background:var(--surface-2); color:var(--muted); cursor:pointer}
  .theme-btn:hover{color:var(--ink)}

  /* ---------- Layout ---------- */
  main{flex:1}
  .container{max-width:1040px; margin:0 auto; padding:48px 20px 96px}
  footer.site{border-top:1px solid var(--line); font-size:12px; color:var(--faint)}
  .footer-inner{max-width:1040px; margin:0 auto; padding:28px 20px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between}

  /* ---------- Editorial type ---------- */
  .eyebrow{font-family:var(--mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--accent)}
  .headline{font-family:var(--serif); font-weight:600; letter-spacing:-.015em; line-height:1.08; color:var(--ink); text-wrap:balance; margin:0}
  .dek{font-size:1.0625rem; line-height:1.6; color:var(--muted); max-width:52ch; margin:0}
  .caption{font-size:.75rem; line-height:1.5; color:var(--faint)}
  .rule{height:1px; background:var(--line); border:0; margin:0}
  .prose{font-size:1.0625rem; line-height:1.7; color:var(--muted)}
  .prose p{margin:0 0 .9rem; max-width:62ch}
  .prose strong{color:var(--ink); font-weight:600}
  .page-head{border-top:1px solid var(--line); padding-top:24px}
  .page-head .meta{display:flex; align-items:baseline; gap:16px}
  .page-head .num{font-family:var(--mono); font-size:.75rem; letter-spacing:.2em; color:var(--accent)}
  .page-head .kick{font-family:var(--mono); font-size:.75rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint)}
  .page-head h2{margin-top:16px; font-size:clamp(1.9rem,4vw,2.4rem)}
  .page-head .dek{margin-top:12px}

  /* ---------- Buttons / chips ---------- */
  button{font-family:inherit}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px;
    border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; transition:.15s}
  .btn:hover{border-color:color-mix(in srgb, var(--accent) 60%, var(--line))}
  .btn.primary{background:var(--accent); border-color:transparent; color:#fff; font-weight:600}
  .btn.primary:hover{opacity:.9}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  .btn.ghost:hover{color:var(--ink); background:color-mix(in srgb, var(--ink) 6%, transparent)}
  .btn:disabled{opacity:.45; cursor:default}
  .btn:disabled:hover{border-color:var(--line)}
  .btn:focus-visible,.chip:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset:2px}
  .chip{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--muted); font-size:14px; cursor:pointer; transition:.15s}
  .chip:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); color:var(--ink)}
  .chip.active{border-color:color-mix(in srgb, var(--accent) 70%, var(--line)); color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent)}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .applybtn{display:flex; flex-direction:column; align-items:center; gap:4px; border:1px solid var(--line); border-radius:10px;
    background:color-mix(in srgb, var(--surface-3) 40%, transparent); padding:12px; cursor:pointer; transition:.15s; color:var(--ink)}
  .applybtn:hover{background:var(--surface-3)}
  .applybtn:disabled{cursor:default}

  /* ---------- Panels ---------- */
  .panel{border:1px solid var(--line); background:var(--surface-2); border-radius:14px; box-shadow:var(--shadow); padding:18px}
  .panel h3{margin:0 0 12px; font-size:14px; font-weight:600; color:var(--ink)}
  .quiet{border:1px solid var(--line); background:color-mix(in srgb, var(--surface-2) 55%, transparent); border-radius:11px; padding:14px}
  .grid-two{display:grid; gap:32px; grid-template-columns:1fr}
  @media (min-width:960px){ .grid-two{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)} }
  .sticky-col{position:relative}
  @media (min-width:960px){ .sticky-col{position:sticky; top:88px} }
  .stack{display:flex; flex-direction:column; gap:18px}
  .grid2{display:grid; gap:16px; grid-template-columns:1fr}
  @media (min-width:640px){ .grid2{grid-template-columns:1fr 1fr} }
  .grid3{display:grid; gap:12px; grid-template-columns:1fr}
  @media (min-width:560px){ .grid3{grid-template-columns:1fr 1fr 1fr} }
  .grid4{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  @media (min-width:560px){ .grid4{grid-template-columns:1fr 1fr 1fr 1fr} }

  /* ---------- Math ---------- */
  .eq{margin:0; padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2);
    text-align:center; font-family:var(--serif); font-size:1.1rem; line-height:1.6; color:var(--ink); overflow-x:auto}
  .eq i,.prose i,.m i{font-family:var(--serif); font-style:italic}
  .m{font-family:var(--serif); font-size:1.02em; color:var(--ink)}
  .eq .op{color:var(--muted)}
  .state-eq{font-family:var(--serif); font-size:1.15rem; line-height:1.7; color:var(--ink)}
  .eqbox{border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center; background:var(--surface-2)}
  .eqbox + .eqbox{margin-top:8px}

  /* 2×2 matrix */
  .matrix{position:relative; display:inline-block; padding:4px 12px; vertical-align:middle}
  .matrix::before,.matrix::after{content:""; position:absolute; top:0; bottom:0; width:9px; border:1.5px solid var(--ink)}
  .matrix::before{left:0; border-right:0; border-radius:3px 0 0 3px}
  .matrix::after{right:0; border-left:0; border-radius:0 3px 3px 0}
  .mx-row{display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; text-align:center}
  .mx-cell{font-family:var(--serif); font-size:1.05rem; color:var(--ink); padding:3px 2px; min-width:2.2em}
  .matrix-wrap{display:inline-flex; align-items:center; gap:10px}
  .mx-label{font-family:var(--serif); color:var(--ink)}

  /* ---------- Data widgets ---------- */
  .stat{border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb, var(--surface-3) 55%, transparent); padding:12px 14px}
  .stat .lbl{display:block; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.16em; color:var(--faint)}
  .stat .val{display:block; margin-top:4px; font-family:var(--mono); font-size:1.15rem; font-weight:600}
  .stat .hint{display:block; margin-top:2px; font-size:11px; color:var(--faint)}
  .readout{border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb, var(--surface-3) 45%, transparent); padding:12px}
  .readout-head{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:500; color:var(--ink); margin-bottom:6px}
  .readout .dot{width:10px; height:10px; border-radius:50%}
  .amprow{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:10px; padding:8px 12px}
  .blochrow{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line);
    border-radius:10px; background:color-mix(in srgb, var(--surface-3) 40%, transparent); padding:12px 14px}
  .coefrow{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:10px; padding:8px 12px}
  .cmpblock{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:16px}
  .cmpblock .ct{margin:0; font-size:14px; font-weight:600; color:var(--ink)}
  .cmpblock .cl{margin:0; font-size:14px; line-height:1.6; color:var(--muted)}
  .bullets{margin:12px 0 0; padding-left:18px; font-size:14px; line-height:1.7; color:var(--muted)}
  .fieldrow{display:flex; align-items:baseline; justify-content:space-between; gap:16px; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); padding:7px 0}
  .fieldrow:last-child{border-bottom:0}
  .fieldrow .fl{font-size:12px; color:var(--faint)}
  .fieldrow .fv{font-family:var(--mono); font-size:13px; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums}
  .step{border-top:1px solid var(--line); margin-top:14px; padding-top:14px}
  .step:first-child{border-top:0; margin-top:0; padding-top:0}

  /* ---------- Sliders ---------- */
  .slider{width:100%}
  .slider + .slider{margin-top:14px}
  .slider-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px}
  .slider-top label{font-size:12px; font-weight:500; color:var(--muted)}
  .slider-val{font-family:var(--mono); font-size:12px; color:var(--accent); font-variant-numeric:tabular-nums}
  input[type="range"].range{-webkit-appearance:none; appearance:none; width:100%; height:1.5rem; background:transparent; cursor:pointer}
  input[type="range"].range::-webkit-slider-runnable-track{height:.3rem; border-radius:999px;
    background:linear-gradient(to right, var(--accent) 0%, var(--accent) var(--range-progress,50%),
      color-mix(in srgb, var(--line) 90%, transparent) var(--range-progress,50%), color-mix(in srgb, var(--line) 90%, transparent) 100%)}
  input[type="range"].range::-moz-range-track{height:.3rem; border-radius:999px; background:var(--line)}
  input[type="range"].range::-moz-range-progress{height:.3rem; border-radius:999px; background:var(--accent)}
  input[type="range"].range::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; margin-top:-.35rem; height:1rem; width:1rem;
    border-radius:999px; background:var(--surface-2); border:2px solid var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent)}
  input[type="range"].range::-moz-range-thumb{height:1rem; width:1rem; border-radius:999px; background:var(--surface-2); border:2px solid var(--accent)}
  input[type="range"].range:focus-visible{outline:none}

  /* ---------- Notice / key idea ---------- */
  .keyidea{border-left:2px solid var(--accent); padding-left:16px}
  .keyidea .eyebrow{color:var(--faint)}
  .keyidea p{margin:6px 0 0; font-size:.95rem; line-height:1.6; color:color-mix(in srgb, var(--ink) 92%, transparent)}
  .notice{border:1px solid var(--line); background:color-mix(in srgb, var(--surface-3) 60%, transparent); border-radius:12px; padding:14px 16px}
  .notice .eyebrow{color:var(--faint)}
  .notice p{margin:6px 0 0; font-size:.92rem; line-height:1.6; color:var(--muted)}
  details.expand{border:1px solid var(--line); border-radius:12px; background:var(--surface-2)}
  details.expand summary{list-style:none; cursor:pointer; padding:12px 16px; font-size:14px; font-weight:500; color:var(--ink); display:flex; justify-content:space-between; align-items:center; gap:12px}
  details.expand summary::-webkit-details-marker{display:none}
  details.expand summary::after{content:"+"; font-family:var(--mono); color:var(--faint)}
  details.expand[open] summary::after{content:"–"}
  details.expand .body{padding:0 16px 14px; border-top:1px solid var(--line); font-size:14px; line-height:1.65; color:var(--muted)}

  /* ---------- Bloch canvas ---------- */
  .bloch-wrap{position:relative; width:100%; height:min(56vh,460px); min-height:320px;
    border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface-2)}
  .bloch-wrap canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
  .bloch-wrap canvas:active{cursor:grabbing}
  .legend{position:absolute; left:12px; top:12px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; z-index:2}
  .legend span{display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 80%, transparent); font-size:12px; color:var(--muted)}
  .legend .dot{width:9px; height:9px; border-radius:50%}
  .bloch-hint{position:absolute; right:12px; bottom:12px; z-index:2; font-family:var(--mono); font-size:10px;
    text-transform:uppercase; letter-spacing:.16em; color:var(--faint); border:1px solid var(--line); border-radius:999px;
    padding:4px 11px; background:color-mix(in srgb, var(--surface) 80%, transparent)}

  /* ---------- Circuit ---------- */
  .circuit{width:100%; height:auto; display:block}
  .circuit text{font-family:var(--mono); font-size:12px; fill:var(--muted)}
  .circuit .wire{stroke:var(--line); stroke-width:1.5}
  .circuit .gate{stroke:var(--ink); stroke-width:1.5; fill:var(--surface-2)}
  .circuit .ctl{fill:var(--ink)}
  .circuit .err{stroke:var(--bad); fill:color-mix(in srgb, var(--bad) 12%, transparent)}
  .circuit .fix{stroke:var(--accent); fill:color-mix(in srgb, var(--accent) 12%, transparent)}
  .circuit .lbl-err{fill:var(--bad)}
  .circuit .lbl-fix{fill:var(--accent)}
  .circuit .qnum{fill:var(--faint)}

  /* ---------- Parity diagram ---------- */
  .parity{width:100%; height:auto; display:block}
  .pq-node{fill:var(--surface-2); stroke:var(--line); stroke-width:1.5}
  .pq-node.sel{stroke:var(--accent); stroke-width:2.5}
  .pq-link{fill:none; stroke:var(--line); stroke-width:1.5}
  .pq-link.ok{stroke:var(--accent)}
  .pq-link.fail{stroke:var(--bad)}
  .pq-pill{fill:var(--surface-2); stroke:var(--line)}
  .pq-pill.ok{stroke:var(--accent)}
  .pq-pill.fail{stroke:var(--bad); fill:color-mix(in srgb, var(--bad) 10%, transparent)}
  .pq-text{fill:var(--muted); font-family:var(--mono); font-size:12px}
  .pq-q{fill:var(--ink); font-family:var(--mono); font-size:13px; font-weight:600}
  .pq-badge rect{stroke-width:1.5}
  .pq-badge.err rect{fill:color-mix(in srgb, var(--bad) 12%, transparent); stroke:var(--bad)}
  .pq-badge.err text{fill:var(--bad)}
  .pq-badge.fix rect{fill:color-mix(in srgb, var(--accent) 12%, transparent); stroke:var(--accent)}
  .pq-badge.fix text{fill:var(--accent)}
  .pq-hit{fill:transparent; cursor:pointer}
  .syndrome-strip{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:center;
    margin-top:14px; padding:10px 14px; border:1px solid var(--line); border-radius:11px;
    background:color-mix(in srgb, var(--surface-3) 50%, transparent); font-size:13px; color:var(--muted)}
  .syndrome-strip b{font-family:var(--mono); color:var(--ink); font-weight:600}
  .syndrome-strip .sy{font-family:var(--mono); color:var(--accent); font-weight:600}
  .cmp-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--line)}
  .cmp-row:first-child{border-top:0; padding-top:0}
  .result-tag{display:inline-flex; align-items:center; font-family:var(--mono); font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--line)}
  .result-tag.detected{color:var(--good); border-color:color-mix(in srgb, var(--good) 45%, var(--line))}
  .result-tag.undetected{color:var(--amber); border-color:color-mix(in srgb, var(--amber) 45%, var(--line))}

  /* ---------- Transition ---------- */
  .transition{margin-top:64px; border-top:1px solid var(--line); padding-top:32px; display:grid; gap:24px}
  @media (min-width:640px){ .transition{grid-template-columns:auto 1fr; gap:40px} }
  .transition .big{font-family:var(--serif); font-size:3rem; line-height:1; color:color-mix(in srgb, var(--accent) 70%, transparent)}
  .transition .q{font-family:var(--serif); font-weight:600; font-size:1.6rem; letter-spacing:-.01em; margin:8px 0 0; color:var(--ink); text-wrap:balance}
  .transition .teaser{margin-top:12px; font-size:1.0625rem; line-height:1.6; color:var(--muted); max-width:52ch}

  /* ---------- Roadmap ---------- */
  .roadmap{display:grid; gap:22px; grid-template-columns:1fr; margin:0; padding:0; list-style:none}
  @media (min-width:680px){ .roadmap{grid-template-columns:1fr 1fr} }
  .roadmap li{border-top:1px solid var(--line); padding-top:16px}
  .roadmap a{text-decoration:none; display:block}
  .roadmap .n{font-family:var(--serif); font-size:1.5rem; color:color-mix(in srgb, var(--accent) 80%, transparent)}
  .roadmap .t{margin-top:8px; font-size:1rem; font-weight:600; color:var(--ink)}
  .roadmap .l{margin-top:4px; font-size:.9rem; line-height:1.5; color:var(--muted)}

  .backlink{display:inline-flex; align-items:center; gap:8px; margin-bottom:32px; font-size:12px; font-weight:500;
    color:var(--faint); text-decoration:none}
  .backlink:hover{color:var(--accent)}
  .pill{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px;
    padding:4px 12px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--accent)}
  .cover{display:grid; gap:40px; grid-template-columns:1fr; align-items:center}
  @media (min-width:960px){ .cover{grid-template-columns:1.1fr 1fr} }
  .cover h1{font-size:clamp(2.4rem,6vw,3.6rem)}
  .cover .sub{margin-top:18px; font-size:1.15rem; line-height:1.5; color:var(--muted); max-width:34ch}
  .cta{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:28px}
  .feedback{font-size:14px; line-height:1.6; border-radius:11px; padding:12px 14px; border:1px solid var(--line)}
  .feedback.ok{border-color:color-mix(in srgb, var(--good) 45%, var(--line)); background:color-mix(in srgb, var(--good) 9%, transparent); color:var(--good)}
  .feedback.no{border-color:color-mix(in srgb, var(--bad) 45%, var(--line)); background:color-mix(in srgb, var(--bad) 9%, transparent); color:var(--bad)}
  .feedback .cap{display:block; margin-top:4px; color:var(--muted); font-size:12px}

  /* ---------- Home ---------- */
  .home-hero{padding-top:24px}
  .home-title{font-size:clamp(2.6rem,7vw,4rem); margin-top:20px; max-width:18ch}
  .home-sub{margin-top:20px; font-size:1.15rem; line-height:1.6; color:var(--muted); max-width:52ch}
  .modsection{margin-top:64px}
  .modsection-head{display:flex; align-items:center; gap:16px}
  .modgrid{display:grid; gap:22px; grid-template-columns:1fr; margin:24px 0 0; padding:0; list-style:none}
  @media (min-width:760px){ .modgrid{grid-template-columns:1fr 1fr} }
  .modcard{display:flex; flex-direction:column; height:100%; border:1px solid var(--line); border-radius:16px;
    background:var(--surface-2); box-shadow:var(--shadow); padding:26px 24px; text-decoration:none; color:inherit;
    transition:border-color .18s ease, transform .18s ease}
  .modcard:hover{border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); transform:translateY(-2px)}
  .modcard:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset:3px}
  .modcard-label{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.22em; color:var(--accent)}
  .modcard-title{margin-top:14px; font-family:var(--serif); font-weight:600; font-size:1.6rem; line-height:1.15; letter-spacing:-.01em; color:var(--ink)}
  .modcard-desc{margin-top:12px; font-size:1rem; line-height:1.6; color:var(--muted)}
  .modcard-action{margin-top:auto; padding-top:22px; display:inline-flex; align-items:center; gap:8px; font-size:.95rem; font-weight:600; color:var(--accent)}
  .modcard-arrow{transition:transform .18s ease}
  .modcard:hover .modcard-arrow{transform:translateX(4px)}
  @media (prefers-reduced-motion:reduce){ .modcard,.modcard-arrow{transition:none} .modcard:hover{transform:none} }

  /* ---------- Shor register + circuit ---------- */
  .shor{width:100%; height:auto; display:block}
  .shor-block{fill:color-mix(in srgb, var(--surface-3) 45%, transparent); stroke:var(--line); stroke-width:1.5}
  .shor-block-label{fill:var(--faint); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em}
  .shor-qubit{fill:var(--surface-2); stroke:var(--line); stroke-width:1.5}
  .shor-qubit.sel{stroke:var(--accent); stroke-width:2.5}
  .shor-qubit.hl{stroke:var(--accent-2); stroke-width:2.5}
  .shor-qubit.err{stroke:var(--bad); stroke-width:2.5}
  .shor-qubit.fix{stroke:var(--accent); stroke-width:2.5}
  .shor-q{fill:var(--ink); font-family:var(--mono); font-size:12px; font-weight:600}
  .shor-zlink{stroke:var(--line); stroke-width:2}
  .shor-zlink.hl{stroke:var(--accent-2)}
  .shor-xrect{fill:none; stroke:var(--accent-2); stroke-width:1.5; stroke-dasharray:4 3}
  .shor-badge rect{stroke-width:1.5}
  .shor-badge.err rect{fill:color-mix(in srgb, var(--bad) 12%, transparent); stroke:var(--bad)}
  .shor-badge.err text{fill:var(--bad)}
  .shor-badge.fix rect{fill:color-mix(in srgb, var(--accent) 12%, transparent); stroke:var(--accent)}
  .shor-badge.fix text{fill:var(--accent)}
  .shor-hit{fill:transparent; cursor:pointer}
  .shor-wire{stroke:var(--line); stroke-width:1.5}
  .shor-gate{stroke:var(--ink); stroke-width:1.5; fill:var(--surface-2)}
  .shor-gate.dim{opacity:.28}
  .shor-ctl{fill:var(--ink)}
  .shor-ctl.dim{opacity:.28}
  .shor-glabel{fill:var(--muted); font-family:var(--mono); font-size:11px}
  .shor-qubit.input{stroke:var(--accent); stroke-width:2.5}
  .shor-qubit.ancilla{opacity:.5}
  .shor-block.enc{stroke:var(--accent-2)}
  .shor-input-label{fill:var(--accent); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em}
  .shor-gate.applied{stroke:var(--accent)}
  .shor-ctl.applied{fill:var(--accent)}
  .shor-gate.active{stroke:var(--accent-2); stroke-width:2.5}
  .shor-ctl.active{fill:var(--accent-2)}
  .shor-step{font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--accent)}
  .shor-layers{display:grid; gap:12px; grid-template-columns:1fr}
  @media (min-width:640px){ .shor-layers{grid-template-columns:1fr 1fr} }
  .shor-layer{border-top:2px solid var(--accent-2); padding-top:10px}
  .shor-layer .t{font-size:.95rem; font-weight:600; color:var(--ink)}
  .shor-layer .d{font-size:.85rem; line-height:1.5; color:var(--muted)}
  .chart{width:100%; height:auto; display:block}
  .ch-grid{stroke:var(--line); stroke-width:1; opacity:.6}
  .ch-lbl{fill:var(--faint); font-family:var(--mono); font-size:11px}
  .ch-cursor{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:4 3}
  .ch-line{fill:none; stroke-width:2.2}
  .ch-dot{stroke:var(--surface-2); stroke-width:1.5}
  .legend-chart{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:10px}
  .legend-chart span{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
  .legend-chart i{width:16px; height:3px; border-radius:2px; display:inline-block}
  .quiz-opt{display:block; width:100%; text-align:left; border:1px solid var(--line); border-radius:11px;
    background:var(--surface-2); padding:12px 14px; margin-top:8px; cursor:pointer; font-size:14px; color:var(--ink); transition:.15s}
  .quiz-opt:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  .quiz-opt.selected{border-color:color-mix(in srgb, var(--accent) 70%, var(--line)); background:color-mix(in srgb, var(--accent) 8%, transparent)}
  .quiz-opt.correct{border-color:color-mix(in srgb, var(--good) 55%, var(--line)); background:color-mix(in srgb, var(--good) 9%, transparent); color:var(--good)}
  .quiz-opt.wrong{border-color:color-mix(in srgb, var(--bad) 55%, var(--line)); background:color-mix(in srgb, var(--bad) 9%, transparent); color:var(--bad)}
  .quiz-opt:disabled{cursor:default}
  .quiz-prog{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:12px}
  .quiz-review{border-top:1px solid var(--line); padding-top:14px; margin-top:14px}
  .quiz-review .q{font-size:.95rem; font-weight:600; color:var(--ink)}
  .quiz-review .a{font-size:.85rem; color:var(--muted); margin-top:4px}
  .stabs{display:grid; gap:8px; grid-template-columns:1fr 1fr}
  .stab{border:1px solid var(--line); border-radius:9px; background:var(--surface-2); padding:8px 10px; cursor:pointer; font-size:13px}
  .stab:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  .stab.active{border-color:color-mix(in srgb, var(--accent-2) 70%, var(--line)); background:color-mix(in srgb, var(--accent-2) 8%, transparent)}
  .stab .m{font-size:13px}
  .stab .res{float:right; font-family:var(--mono); font-size:12px; color:var(--muted)}
  .stab .res.neg{color:var(--bad)}
  .stab .res.pos{color:var(--good)}

  /* ---------- Module 4 · Iceberg register ---------- */
  .ice{width:100%; height:auto; display:block}
  .ice-node{fill:var(--surface-2); stroke:var(--line); stroke-width:1.5}
  .ice-node.sel{stroke:var(--accent); stroke-width:2.5}
  .ice-q{fill:var(--ink); font-family:var(--mono); font-size:13px; font-weight:600}
  .ice-link{stroke-width:1.6; fill:none}
  .ice-link.sx{stroke:var(--accent-2); stroke-dasharray:5 4}
  .ice-link.sz{stroke:var(--accent)}
  .ice-lbl{font-family:var(--mono); font-size:11px}
  .ice-lbl.sx{fill:var(--accent-2)}
  .ice-lbl.sz{fill:var(--accent)}
  .ice-badge rect{stroke-width:1.5}
  .ice-badge.err rect{fill:color-mix(in srgb, var(--bad) 12%, transparent); stroke:var(--bad)}
  .ice-badge.err text{fill:var(--bad)}
  .ice-badge.fix rect{fill:color-mix(in srgb, var(--accent) 12%, transparent); stroke:var(--accent)}
  .ice-badge.fix text{fill:var(--accent)}
  .m .pX{color:var(--bad)}
  .m .pY{color:var(--good)}
  .m .pZ{color:var(--accent)}
  .ice-node.hl{stroke:var(--accent-2); stroke-width:2.5}
  .ice-bars{width:100%; height:auto; display:block}
  .ice-bars-grid{stroke:var(--line); stroke-width:1; opacity:.6}
  .ice-bars-lbl{fill:var(--faint); font-family:var(--mono); font-size:10px}
  .ice-bars-val{fill:var(--ink); font-family:var(--mono); font-size:11px}
  .ice-bars-name{fill:var(--muted); font-family:var(--sans); font-size:11px}
  .ice-bars-bar{stroke:var(--surface-2); stroke-width:1}
  @keyframes qc-fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .fade-in{animation:qc-fade .45s ease both}
  .reveal{animation:qc-fade .4s ease both}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .fade-in,.reveal{animation:none} }
</style>
</head>
